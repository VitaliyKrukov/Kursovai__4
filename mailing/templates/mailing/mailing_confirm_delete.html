{% extends 'base.html' %}

{% block title %}Удаление рассылки - Сервис рассылок{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление рассылки</h1>

<p>Вы уверены, что хотите удалить рассылку #{{ object.id }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
