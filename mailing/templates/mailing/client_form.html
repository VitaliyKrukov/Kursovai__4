{% extends 'base.html' %}

{% block title %}{% if object %}Редактирование{% else %}Добавление{% endif %} клиента - Сервис рассылок{% endblock %}

{% block content %}
<h1 class="mb-4">{% if object %}Редактирование клиента{% else %}Добавление клиента{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                {{ form.as_p }}
            </div>
        </div>
    </div>
    
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
