{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">Восстановление пароля</h4>
            </div>
            <div class="card-body">
                <p>Введите ваш email адрес, и мы вышлем инструкции для восстановления пароля.</p>
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email адрес</label>
                        <input type="email" name="email" class="form-control" required id="id_email">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Отправить инструкции</button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'users:login' %}">Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
